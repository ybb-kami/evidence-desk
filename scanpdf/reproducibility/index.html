<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>代码复现证据 · 证据台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#20332c;font:16px/1.6 system-ui,sans-serif}
main{max-width:880px;margin:auto;padding:1.5rem}section{background:#fff;padding:1rem 1.25rem;margin:1rem 0;border:1px solid #ccd5ce;border-radius:.4rem}
h1{margin:.65rem 0 .3rem}h2{font-size:1.2rem;margin:.2rem 0 .55rem}h3{font-size:1rem;margin:0}
p{margin:.45rem 0}.muted{color:#496157}label{display:block;font-weight:600}select,button{font:inherit;color:inherit;border:1px solid #86978f;border-radius:.28rem;padding:.4rem .6rem}
select{width:100%;background:#fff;margin:.25rem 0 .6rem}button{color:white;background:#205b4d;cursor:pointer;margin:.5rem 0 0}
button:disabled{background:#687c72;cursor:default}a{color:#126458;text-underline-offset:.15em}
blockquote{white-space:pre-wrap;overflow-wrap:anywhere;margin:.65rem 0 0;padding-left:.85rem;border-left:.2rem solid #aec6bb}
.consent{display:flex;align-items:baseline;gap:.55rem;font-weight:400;margin:.65rem 0 0}
dl{display:grid;grid-template-columns:minmax(5rem,9rem) minmax(0,1fr);gap:.4rem 1rem}dt{font-weight:600}dd{margin:0;overflow-wrap:anywhere}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:1rem}
.file-group{border-top:1px solid #ccd5ce;padding-top:.65rem}ul{padding-left:1.3rem;margin:.3rem 0}.file-group li{overflow-wrap:anywhere}
code{font-size:.87rem;overflow-wrap:anywhere}.status{min-height:1.6em}
</style>
<main>
<a href="/">返回工作台</a>
<h1>代码复现证据</h1>
<p>从所选论文定位公开 GitHub 引用，核对固定提交中的材料。</p>
<section aria-labelledby="paper-heading">
<h2 id="paper-heading">论文与仓库</h2>
<label for="paper">本地文献</label>
<select id="paper" disabled></select>
<p id="notice" class="status muted" role="status"></p>
<div id="selection" hidden>
<label for="reference">原文中的仓库引用</label>
<select id="reference"></select>
<blockquote id="quote"></blockquote>
<p><a id="source" target="_blank" rel="noopener">核对 PDF 原文位置</a></p>
<form id="audit-form">
<label class="consent"><input id="consent" type="checkbox"><span id="consent-text"></span></label>
<button id="audit-button" type="submit" disabled>核对公开仓库</button>
</form>
</div>
</section>
<p id="audit-status" class="status" role="status"></p>
<section id="result" aria-live="polite" hidden></section>
<section id="snapshot-result" aria-live="polite" hidden></section>
</main>
<script src="/reproducibility.js" defer></script>
</html>
