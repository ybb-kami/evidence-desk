<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>版本证据核对 · Evidence Desk</title>
<style>
  :root{font-family:system-ui,sans-serif;color:#182a27;background:#f4f7f5;line-height:1.55}
  *{box-sizing:border-box}
  body{max-width:72rem;margin:auto;padding:1.2rem clamp(.75rem,3vw,2.5rem) 3rem}
  a{color:#005444;text-underline-offset:.22em}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2a6699;outline-offset:3px}
  h1{margin:.65rem 0 .4rem;font-size:clamp(1.6rem,4vw,2.25rem)}
  h2{font-size:1.25rem;margin:0 0 .45rem}
  h3{font-size:1.05rem;margin:0}
  p{margin:.5rem 0}
  header p,.note{color:#475851}
  section,form{background:#fff;border:1px solid #c5d4ce;border-radius:.55rem;margin-top:1rem;padding:1rem}
  .grid{display:grid;gap:.85rem;grid-template-columns:repeat(2,minmax(0,1fr))}
  label{display:block;font-weight:630}
  select,button{font:inherit;padding:.55rem .65rem;min-height:2.65rem}
  select{display:block;width:100%;margin-top:.35rem;background:#f7faf8;color:inherit;border:1px solid #8a9f96;border-radius:.3rem}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin-top:.8rem}
  .controls label{display:flex;align-items:center;gap:.35rem}
  .controls input{width:1rem;height:1rem}
  button{background:#005849;color:#fff;border:0;border-radius:.3rem;cursor:pointer}
  button:disabled{background:#516660;cursor:default}
  .error{color:#8c271e}
  .result-row + .result-row{border-top:1px solid #d9e3de;margin-top:1rem;padding-top:1rem}
  .pane{min-width:0;padding:.75rem;background:#f2f7f4;border-radius:.3rem;overflow-wrap:anywhere}
  .pane h4{margin:0 0 .45rem;color:#36504a;font-size:.9rem}
  blockquote{margin:.4rem 0;white-space:pre-wrap;overflow-wrap:anywhere}
  .links{display:flex;flex-wrap:wrap;gap:0 .85rem;margin-top:.45rem;font-size:.9rem}
  .score{font-variant-numeric:tabular-nums}
  @media(max-width:40rem){.grid{grid-template-columns:minmax(0,1fr)}section,form{padding:.75rem}}
</style>
<script src="/version-evidence.js" defer></script>
</head>
<body>
<header>
  <a href="/">返回文库</a>
  <h1>版本证据核对</h1>
  <p>选择两份 PDF，核对作品标识、标题、摘要与段落的原页证据。也可以选择已归档的版本。</p>
</header>
<form id="compare">
  <div class="grid">
    <label for="before">左侧 PDF<select id="before" required disabled></select></label>
    <label for="after">右侧 PDF<select id="after" required disabled></select></label>
  </div>
  <div class="controls">
    <label><input type="checkbox" id="semantic" checked> 使用本机 E5 语义模型</label>
    <button id="submit" disabled>比较所选 PDF</button>
  </div>
</form>
<p id="status" role="status" aria-live="polite">正在读取本地文库…</p>
<main id="results" hidden>
  <section aria-labelledby="identity-heading">
    <h2 id="identity-heading">作品标识</h2>
    <p id="identity"></p>
    <div id="markers" class="grid"></div>
  </section>
  <section aria-labelledby="abstract-heading">
    <h2 id="abstract-heading">标题与摘要</h2>
    <p class="note" id="model"></p>
    <div id="front"></div>
  </section>
  <section aria-labelledby="passages-heading">
    <h2 id="passages-heading">局部段落对照</h2>
    <p class="note" id="scope"></p>
    <div id="passages"></div>
  </section>
</main>
</body>
</html>
