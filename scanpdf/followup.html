<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>证据追问 · 证据台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#1b2e29;font:16px/1.6 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:1.5rem}a{color:#12685d}
section,form{background:#fff;padding:1rem;border:1px solid #ccd5ce;border-radius:.4rem;margin:1rem 0}
label{display:block;font-weight:600}select,input,button{font:inherit;padding:.45rem .65rem;border:1px solid #8b9d93;border-radius:.3rem;background:white;color:inherit}
select,input{width:100%;margin:.3rem 0 .6rem}button{cursor:pointer}button:disabled{cursor:default}button.primary{background:#18574d;color:white}
blockquote{white-space:pre-wrap;overflow-wrap:anywhere;margin:.5rem 0;padding-left:.8rem;border-left:3px solid #b2c7ba}h2{font-size:1.15rem}
article{padding:.7rem 0;border-top:1px solid #d6dfd8}article a{margin-right:.7rem}
.model-receipt{margin:.45rem 0;padding:.35rem .6rem;background:#f2f6f2;border-left:3px solid #7d9e8c;font-size:.92rem;overflow-wrap:anywhere}
.model-receipt[data-state="failed"]{background:#fff3ec;border-color:#a45437}
</style>
<main><a href="/">返回工作台</a><h1>证据追问</h1><label for="doc">当前文献</label><select id="doc"></select>
<p>先在整篇文献中提问。选中命中摘录的「在此段追问」后，后续问题只查询该段原文。</p>
<div id="history" aria-live="polite"></div>
<form id="ask"><p id="scope">检索范围：当前文献全文</p><button type="button" id="release" hidden>返回全文范围</button>
<label for="question">问题</label><input id="question" maxlength="500" required autocomplete="off">
<label><input type="checkbox" id="flash-consent" style="width:auto"> 本次允许 DeepSeek Flash 接收问题和命中摘录以生成回答</label>
<button class="primary" id="send">查找原文</button> <button type="button" id="clear">清空会话</button></form><p id="status" role="status"></p></main>
<script>
'use strict';
const byId = id=>document.getElementById(id);
const picker=byId('doc'), historyBox=byId('history'), field=byId('question'), scope=byId('scope'), release=byId('release');
let anchor=null, version=0;
function node(tag,text){const n=document.createElement(tag); n.textContent=text; return n;}
function locationText(a){return '物理页 '+a[0]+' · 文本块 '+a[1]+' · 摘录 '+a[2];}
function selectAnchor(value){
  version++;
  anchor=value;
  scope.textContent='检索范围：'+(value?locationText(value):'当前文献全文');
  release.hidden=!value;
  byId('status').textContent='';
  byId('flash-consent').checked=false;
  byId('send').disabled=!picker.value;
}
function clearSession(){
  selectAnchor(null);
  historyBox.replaceChildren();
  field.value='';
  byId('status').textContent='';
}
function locator(hit,start,end){
  const params=new URLSearchParams({id:hit.id,page:hit.page,block:hit.block,part:hit.part||1});
  if(Number.isInteger(start)&&Number.isInteger(end)&&end>start){
    params.set('start',start); params.set('end',end);
  }
  const link=node('a','定位原文'); link.href='/source?'+params;
  link.target='_blank'; link.rel='noopener'; return link;
}
function cite(hit){
  const block=document.createElement('article'), position=[hit.page,hit.block,hit.part||1];
  const source=node('a',locationText(position)+' · 打开原 PDF');
  source.href='/pdf/'+hit.id+'#page='+hit.page; source.target='_blank'; source.rel='noopener';
  block.append(source,locator(hit,hit.start,hit.end));
  if(hit.source==='ocr'){
    const scan=node('a','核对 OCR 图像'); scan.href='/scan?id='+hit.id+'&page='+hit.page; block.append(scan);
  }
  const focus=node('button','在此段追问'); focus.type='button';
  focus.onclick=()=>{selectAnchor(position); field.focus();};
  block.append(node('blockquote',hit.text),focus);
  return block;
}
const localMethods=new Set(['local_extractive','direct_measurement','source_fields','abbreviation',
  'table_calculation','scan_table','native_table','book_index','exercise_locator']);
const flashModel='DeepSeek-V4.1-Flash-1017';
function receipt(state,text){
  const result=node('p','模型回执 · '+text);
  result.className='model-receipt'; result.dataset.state=state;
  return result;
}
function verifiedFlashReply(result){
  const generation=result.generation||{};
  const {status,model,model_reply:reply}=generation;
  const method=result.answer_method||result.method;
  const claims=result.claims||generation.claims||[];
  if(model===flashModel && reply==='accepted' && status==='cited_draft' && method==='deepseek_cited_draft' && result.answer && claims.length)
    return 'returned';
  if(model===flashModel && reply==='declined' && status==='insufficient_evidence' && !result.answer)
    return 'declined';
}
function authorizedReceipt(result){
  const {status,model,reason,model_reply:reply}=result.generation||{};
  const method=result.answer_method||result.method;
  const verified=verifiedFlashReply(result);
  if(verified==='returned')return receipt(verified,model+' 已返回回答，服务端引文核对通过。');
  if(verified==='declined')return receipt(verified,model+' 已明确返回证据不足，未给出答案。');
  if(model===flashModel && reply==='rejected')
    return receipt('failed','DeepSeek Flash 已返回，响应或引文未通过核对。');
  if(localMethods.has(method))
    return receipt('local',result.answer?'本地规则已给出结果，未调用模型。':'已按本地证据规则处理，未调用模型。');
  if(['validation_failed','incomplete','misconfigured','unavailable','busy'].includes(status))
    return receipt('failed','模型请求或响应校验未完成。');
  if(reason==='no_source' || (status==='insufficient_evidence' && !model && reason) || result.hits?.length===0 || result.has_evidence===false)
    return receipt('no-evidence','当前原文不足以供模型回答，未调用模型。');
  return receipt('unverified','本次没有可核实的模型回执。');
}
function modelDraft(turn,question,id,current){
  const button=node('button','根据摘录生成有引文的回答'); button.type='button';
  const output=node('div',''); output.setAttribute('role','status');
  button.onclick=async()=>{
    if(button.disabled || !window.confirm('本次将问题和最多六条原文摘录发送至 DeepSeek，以生成带引文的回答。继续吗？'))return;
    button.disabled=true;
    output.replaceChildren(node('p','正在核对草稿引文…'));
    try{
      const response=await fetch('/api/followup/model',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id,question,anchor:current,consent:true})});
      const data=await response.json();
      if(!response.ok)throw Error(data.error||'草稿请求未完成。');
      if(data.status==='cited_draft' && data.model===flashModel && data.claims?.length){
        output.replaceChildren(receipt('returned',data.model+' 已返回草稿，服务端引文核对通过。'));
        for(const claim of data.claims){
          const article=node('article','');
          const link=node('a','物理页 '+claim.page+' · 文本块 '+claim.block);
          link.href='/pdf/'+claim.id+'#page='+claim.page; link.target='_blank'; link.rel='noopener';
          article.append(node('p',claim.text),link,locator(claim),node('blockquote',claim.quote));
          output.append(article);
        }
      }else if(data.status==='not_configured'){
        output.replaceChildren(receipt('not-configured','服务端未配置或未启用 DeepSeek Flash。'));
      }else if(data.status==='validation_failed'){
        output.replaceChildren(receipt('failed','模型草稿未通过引文或数值核对。'));
      }else{
        output.replaceChildren(receipt('unverified','本次没有可用的带引文草稿。'));
      }
    }catch(error){output.replaceChildren(receipt('failed','草稿请求未完成，未确认模型返回。'+error.message));}
    finally{button.disabled=false;}
  };
  turn.append(button,output);
}
picker.onchange=clearSession;
byId('clear').onclick=clearSession;
release.onclick=()=>{selectAnchor(null);field.focus();};
byId('ask').onsubmit=async event=>{
  event.preventDefault();
  const question=field.value.trim();
  if(!picker.value||!question||byId('send').disabled)return;
  const active=++version, current=anchor, id=picker.value;
  const consent=byId('flash-consent').checked;
  byId('flash-consent').checked=false;
  byId('send').disabled=true; byId('status').textContent='正在查找原文…';
  try{
    const response=await fetch('/api/followup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,question,anchor:current,model_consent:consent})});
    const data=await response.json();
    if(active!==version)return;
    if(!response.ok)throw Error(data.error||'检索失败。');
    const turn=document.createElement('section');
    turn.append(node('h2',question),node('p',picker.selectedOptions[0].text+' · '+(current?locationText(current):'全文')));
    const configured=data.model_status!=='not_configured' && data.model_available!==false;
    if(!consent)turn.append(receipt('not-authorized','本次未授权，使用本地处理。'));
    else if(!configured)turn.append(receipt('not-configured','服务端未配置或未启用 DeepSeek Flash，本次使用本地处理。'));
    else if(!data.fields?.length)turn.append(authorizedReceipt(data));
    if(data.fields?.length) {
      for(const field of data.fields) {
        const panel=node('article',''); panel.append(node('h3',field.question));
        if(consent && configured)panel.append(authorizedReceipt(field));
        panel.append(node(field.answer?'strong':'p',field.answer||field.gap));
        for(const claim of field.claims||[])panel.append(locator(claim,claim.answer_start,claim.answer_end));
        turn.append(panel);
      }
    } else if(data.answer) {
      turn.append(node('strong',data.answer));
      const method={local_extractive:'本机 MobileBERT 原文抽取',
        fieldwise:'按问题逐项核对',direct_measurement:'原句中的唯一明确读数',source_fields:'原文字段核对',abbreviation:'原文括号中的全称',table_calculation:'原表计算',scan_table:'扫描单元格',native_table:'原生 PDF 单元格',book_index:'书末索引原条目',exercise_locator:'编号习题原文'};
      if(method[data.answer_method])turn.append(node('p',method[data.answer_method]));
    }
    for(const claim of data.fields?.length?[]:data.generation?.claims||[]){
      const cited=node('p','引文 · '+claim.span+' ');
      cited.append(locator(claim,claim.answer_start,claim.answer_end));
      turn.append(cited);
    }
    if(data.reader?.candidates?.length){
      const details=node('details',''); details.append(node('summary','查看本机抽取候选及原句'));
      for(const candidate of data.reader.candidates){
        const row=node('p',candidate.answer+' · '+candidate.context+' ');
        row.append(locator(candidate,candidate.answer_start,candidate.answer_end)); details.append(row);
      }
      turn.append(details);
    }
    if(data.table_cells?.length){
      const cells=node('ul','');
      for(const cell of data.table_cells){
        const item=node('li','');
        const label=(cell.row_label||'第 '+cell.row+' 行')+' · '+(cell.column_label||'第 '+cell.column+' 列');
        const source=node('a',label+' · 打开物理页 '+cell.page+' 的单元格');
        source.href=(cell.source==='native'?'/source?':'/scan?')+new URLSearchParams({id,page:cell.page,region:cell.region,row:cell.row,column:cell.column});
        source.target='_blank'; source.rel='noopener';
        item.append(source);
        if(cell.method==='crop_ocr')item.append(node('small',' · 单元格裁切重读'));
        cells.append(item);
      }
      turn.append(cells);
    }
    if(data.retrieval){
      const labels={bm25:'全文检索','bm25-phrase':'短语匹配','bm25-recall':'扩展词项检索',keyword:'关键词','multilingual-e5-small':'本机多语向量','paired-measurements':'同句双对象计量匹配'};
      const methods=data.retrieval.methods.map(m=>labels[m]||m);
      const states={index_preparing:'语义索引正在后台建立',busy:'语义索引正忙'};
      if(states[data.retrieval.dense])methods.push(states[data.retrieval.dense]);
      if(methods.length)turn.append(node('small',methods.join(' · ')));
    }
    if(!data.fields?.length && (data.gap || !data.hits.length)) turn.append(node('p',data.gap||'所选范围内没有匹配原文。'));
    for(const hit of data.hits)turn.append(cite(hit));
    const alreadyReplied=consent && (data.fields?.length ? data.fields.every(verifiedFlashReply) : verifiedFlashReply(data));
    const structuredGap=!data.answer && (data.table_cells || ['book_index','exercise_locator'].includes(data.answer_method));
    if(data.model_available && data.hits.length && !structuredGap && !alreadyReplied)
      modelDraft(turn,question,id,current);
    historyBox.append(turn); field.value=''; byId('status').textContent='';
    field.focus();
  }catch(error){
    if(active===version)byId('status').textContent=(consent?'本次追问未完成，未确认模型返回。':'')+error.message;
  }
  finally{if(active===version)byId('send').disabled=false;}
};
(async()=>{
  try{
    const response=await fetch('/api/library');
    if(!response.ok)throw Error('无法读取文库。');
    for(const doc of (await response.json()).docs)picker.add(new Option(doc.name,doc.id));
    const requested=new URLSearchParams(location.search);
    if(requested.has('id'))picker.value=requested.get('id');
    clearSession();
    if(!picker.value){
      byId('status').textContent=requested.has('id')
        ? '指定的文献版本不在活动文库。请返回文库恢复原件，或手动选择另一份文献。'
        : '请先在文库中导入 PDF。';
      return;
    }
    const fields=['page','block','part'];
    if(fields.some(key=>requested.has(key))){
      const active=version;
      byId('send').disabled=true;
      scope.textContent='正在核对所选摘录…';
      if(!requested.has('id') || fields.some(key=>!/^[1-9][0-9]{0,5}$/.test(requested.get(key)))){
        scope.textContent='摘录定位无效。请返回引文原页重新定位。';
        return;
      }
      const params=new URLSearchParams({id:picker.value});
      for(const key of fields)params.set(key,requested.get(key));
      const response=await fetch('/api/source?'+params);
      if(active!==version)return;
      if(!response.ok){scope.textContent='未找到这份原件中的指定摘录。请返回引文原页核对。';return;}
      selectAnchor(fields.map(key=>Number(params.get(key))));
    }
  }catch(error){byId('status').textContent=error.message;}
})();
</script></html>
