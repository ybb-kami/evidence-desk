<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文献综述 · 证据台</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f2;color:#182e2b;font:16px/1.6 'Source Sans 3',system-ui,sans-serif}
main{max-width:1050px;margin:auto;padding:1.5rem}
a{color:#115a52;text-underline-offset:.16em}
fieldset,article,details,.scroll{background:white;border:1px solid #bac9c3;border-radius:.4rem;margin:1rem 0}
fieldset,article,details{padding:.7rem 1rem}
#papers{max-height:14rem;overflow:auto}
#papers label,article a{display:block}
#selected{margin-left:.75rem}
button{padding:.5rem .8rem;margin:.35rem .35rem .35rem 0;font:inherit;color:inherit}
blockquote{border-left:3px solid #a5bdb1;margin:.5rem 0;padding:0 1rem;white-space:pre-line;overflow-wrap:anywhere}
input{margin-right:.5rem}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:38rem;text-align:left}
th,td{padding:.55rem .8rem;border-bottom:1px solid #e0e8e3;vertical-align:top}
th{background:#e9f0eb}tr:last-child td{border-bottom:0}
td small{display:block}
summary{cursor:pointer;font-weight:650}
li{margin:.35rem 0}
nav{display:flex;gap:.45rem 1rem;flex-wrap:wrap}
#review .gap{color:#614530}
:target{scroll-margin-top:1rem;outline:2px solid #267d70;outline-offset:.22rem}
</style>
<main>
  <a href="/">返回工作台</a>
  <h1>文献综述</h1>
  <fieldset>
    <legend>纳入综述的文献</legend>
    <label><input id="all" type="checkbox">全选</label><span id="selected"></span>
    <div id="papers"></div>
  </fieldset>
  <button id="local">整理本地证据</button>
  <button id="remote" hidden>使用 DeepSeek 起草</button>
  <p id="status" role="status"></p>
  <section id="review" aria-live="polite"></section>
</main>
<script>
'use strict';
const get = id => document.getElementById(id);
function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  if (className) element.className = className;
  return element;
}
function link(text, id) {
  const anchor = node('a', text);
  anchor.href = '#' + id;
  return anchor;
}
function section(area, id, title) {
  const content = node('section');
  const heading = node('h2', title);
  heading.id = id;
  content.append(heading);
  area.append(content);
  return content;
}
function dateLink(date) {
  const label = date.kind === 'arxiv_version' ? `arXiv 版本 ${date.date}` : `出版 ${date.year}`;
  return link(label, date.ref);
}
function table(area, headings) {
  const frame = node('div', undefined, 'scroll');
  const grid = node('table');
  const header = grid.createTHead().insertRow();
  for (const title of headings) {
    const column = node('th', title);
    column.scope = 'col';
    header.append(column);
  }
  frame.append(grid);
  area.append(frame);
  return grid.createTBody();
}
function addRow(grid, items) {
  const row = grid.insertRow();
  for (const item of items) row.insertCell().append(item);
  return row;
}
function showPapers(area, data, groups) {
  const content = section(area, 'coverage', '逐份文献');
  const rows = table(content, ['所选 PDF', '摘要摘录', '本库引用', '可核日期']);
  for (const paper of data.papers) {
    const name = node('span');
    const pdf = node('a', paper.name);
    pdf.href = '/pdf/' + paper.id;
    pdf.target = '_blank';
    pdf.rel = 'noopener';
    name.append(pdf);
    if (paper.title !== paper.name) name.append(node('small', paper.title));
    const group = groups.get(paper.work);
    const refs = node('span');
    refs.append(link(group.label, group.id));
    if (!paper.bibliography_detected) refs.append(node('small', '这份 PDF 未识别到参考文献段', 'gap'));
    const row = addRow(rows, [name, paper.abstract ? link(`查看摘要 ${paper.abstract}`, paper.abstract)
      : node('span', '未定位到有明确摘要标题的完整摘录', 'gap'), refs,
      paper.date ? dateLink(paper.date) : node('span', '缺少可定位日期', 'gap')]);
    row.id = 'paper-' + paper.id;
  }
}
function showGraph(area, data, works, groups, sources) {
  const content = section(area, 'citation-graph', '库内引用分组');
  content.append(node('p', '图谱仅使用所选文献。箭头从引用者指向被引用者；直接或间接相连的作品归在同组。PageRank 表示当前选集中的引用位置。'));
  for (const [index, group] of data.groups.entries()) {
    const detail = node('details');
    const {id, label} = groups.get(group.works[0]);
    detail.id = id;
    detail.open = index === 0;
    detail.append(node('summary', `${label} · ${group.works.length} 部作品 · ${group.links.length} 条引用`));
    const rows = table(detail, ['作品', '被引', '引用', 'PageRank']);
    for (const work of group.works.map(id => works.get(id))) {
      addRow(rows, [link(work.title || work.name, 'paper-' + work.id),
        String(work.indegree), String(work.outdegree), work.pagerank.toFixed(4)]);
    }
    if (group.links.length) {
      const connections = node('ul');
      for (const ref of group.links) {
        const item = node('li');
        item.append(link(sources.get(ref).title, ref));
        connections.append(item);
      }
      detail.append(connections);
    }
    content.append(detail);
  }
}
function showFuture(area, data, sources) {
  const content = section(area, 'future-review', '未来工作与后续证据');
  content.append(node('p', '按可定位日期排列，arXiv 日期对应所选版本。仅检查当前选集中日期更晚、已有可回查引用的作品，再按英文主题词与词组筛查其正文。候选摘录需要人工判断是否解决了原问题。'));
  if (!data.follow_ups.length) content.append(node('p', '目前没有找到明确含未来工作措辞的摘录。', 'gap'));
  for (const row of data.follow_ups) {
    const source = sources.get(row.direction);
    const detail = node('details');
    detail.dataset.direction = row.direction;
    const year = row.date ? row.date.year : '日期未定';
    const state = row.matches ? `后续匹配 ${row.matches} 条` : '暂无后续主题证据';
    detail.append(node('summary', `${year} · ${source.title} · ${state}`),
      node('blockquote', source.text), link(`原文 ${source.ref}`, source.ref));
    if (row.date) detail.append(' · ', dateLink(row.date));
    detail.append(node('p', `选集有 ${row.citations} 条指向该作品的引用，${row.later} 条可确认较晚，${row.unordered} 条无法判断先后，已比对 ${row.checked} 篇较晚论文的正文。`));
    if (!row.date) detail.append(node('p', '缺少这份 PDF 的可核日期，无法排列后续文献。', 'gap'));
    else if (!row.comparable_topic) detail.append(node('p', '英文主题词过少，无法按当前规则比对。', 'gap'));
    else if (!row.later) detail.append(node('p', '所选文献里没有日期可确认较晚的已匹配引用。', 'gap'));
    else if (!row.checked) detail.append(node('p', '较晚论文中未提取到可比对的正文。', 'gap'));
    else if (!row.matches) detail.append(node('p', '已查找的正文中未匹配到足够相同的主题词与词组。', 'gap'));
    if (row.candidates.length) {
      const candidates = node('ul');
      for (const match of row.candidates) {
        const later = sources.get(match.excerpt);
        const item = node('li');
        item.append(dateLink(match.date), ' · ', link(later.title + ' 原文', later.ref), ' · ',
          link('参考文献条目', match.citation), node('blockquote', later.text),
          node('small', '匹配词：' + match.terms.join('、')));
        candidates.append(item);
      }
      detail.append(candidates);
    }
    if (row.matches > row.candidates.length) detail.append(node('small', '此处列出日期最早的三条候选。'));
    content.append(detail);
  }
}
function show(data) {
  const area = get('review');
  area.replaceChildren();
  const coverage = data.papers.filter(paper => paper.abstract).length;
  area.append(node('p', `已纳入 ${data.papers.length} 份 PDF、${data.works} 部作品。${coverage} 份有摘要摘录，${data.papers.length - coverage} 份标出缺口。已定位 ${data.edges} 条库内引用。`));
  const navigation = node('nav');
  navigation.setAttribute('aria-label', '综述结果');
  navigation.append(link('逐份文献', 'coverage'), link('库内引用分组', 'citation-graph'),
    link('未来工作与后续证据', 'future-review'), link('原文摘录', 'excerpts'));
  area.append(navigation);
  const messages = {unconfigured:'此服务尚未启用 DeepSeek。',
    unavailable:'本次未取得 DeepSeek 草稿，页面提供本地证据。',
    unverified:'模型输出未通过来源编号和格式检查，页面提供本地证据。',
    insufficient:'至少需要两部作品的摘要证据才能起草比较综述。'};
  if (messages[data.mode]) area.append(node('p', messages[data.mode]));
  if (data.paragraphs.length) {
    const draft = section(area, 'draft', '模型综述草稿');
    draft.append(node('p', '草稿使用最多六部作品的摘录。引用编号已通过检查，请逐段核对论断。'));
    for (const row of data.paragraphs) {
      const paragraph = node('p', row.text + ' ');
      for (const ref of row.refs) paragraph.append(link('[' + ref + '] ', ref));
      draft.append(paragraph);
    }
  }
  const works = new Map(data.nodes.map(work => [work.id, work]));
  const groups = new Map();
  data.groups.forEach((group, index) => {
    const label = group.links.length ? `引用组 ${index + 1}` : '无已匹配库内引用';
    for (const work of group.works) groups.set(work, {id:'group-' + index, label});
  });
  const sources = new Map(data.sources.map(source => [source.ref, source]));
  showPapers(area, data, groups);
  showGraph(area, data, works, groups, sources);
  showFuture(area, data, sources);
  const excerpts = section(area, 'excerpts', '原文摘录');
  for (const category of ['摘要', '引用', '未来工作', '后续正文', '日期']) {
    const rows = data.sources.filter(source => source.category === category);
    if (!rows.length) continue;
    excerpts.append(node('h3', category === '未来工作' ? '未来工作措辞' : category));
    for (const source of rows) {
      const article = node('article');
      article.id = source.ref;
      const pdf = node('a', `${source.name} · 物理第 ${source.page} 页，第 ${source.block} 块`);
      pdf.href = '/pdf/' + source.doc + '#page=' + source.page;
      pdf.target = '_blank';
      pdf.rel = 'noopener';
      article.append(node('strong', source.ref + ' · ' + source.title), node('blockquote', source.text), pdf);
      excerpts.append(article);
    }
  }
}
let revision = 0;
function updateSelection() {
  const boxes = [...get('papers').querySelectorAll('input')];
  const count = boxes.filter(box => box.checked).length;
  get('selected').textContent = `已选 ${count} / ${boxes.length} 份`;
  get('all').checked = count > 0 && count === boxes.length;
  get('all').indeterminate = count > 0 && count < boxes.length;
}
function invalidate() {
  revision++;
  updateSelection();
  get('review').replaceChildren();
  get('status').textContent = '';
  get('local').disabled = get('remote').disabled = false;
}
get('all').onchange = () => {
  for (const box of get('papers').querySelectorAll('input')) box.checked = get('all').checked;
  invalidate();
};
get('papers').onchange = invalidate;
async function run(mode) {
  const ids = [...get('papers').querySelectorAll('input:checked')].map(box => box.value);
  if (ids.length < 2) {get('status').textContent = '请选择至少两份文献。';return;}
  const consent = mode === 'model' && window.confirm('即将把所选文献中最多六部作品的公开摘要、引用与未来工作摘录发送给 DeepSeek 生成草稿。确认发送？');
  if (mode === 'model' && !consent) return;
  const current = ++revision;
  get('local').disabled = get('remote').disabled = true;
  get('review').replaceChildren();
  get('status').textContent = '正在整理…';
  try {
    const reply = await fetch('/api/synthesis', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ids,mode,consent})});
    const data = await reply.json();
    if (current !== revision) return;
    if (!reply.ok) throw Error(data.error || '综述生成失败。');
    show(data);
    get('status').textContent = '';
  } catch (error) {
    if (current === revision) get('status').textContent = error.message;
  } finally {
    if (current === revision) get('local').disabled = get('remote').disabled = false;
  }
}
get('local').onclick = () => run('local');
get('remote').onclick = () => run('model');
(async () => {
  try {
    const reply = await fetch('/api/library');
    if (!reply.ok) throw Error('读取文库失败。');
    const data = await reply.json();
    get('remote').hidden = !data.deepseek_enabled;
    for (const doc of data.docs) {
      const label = node('label');
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.value = doc.id;
      label.append(box, document.createTextNode(doc.name));
      get('papers').append(label);
    }
    updateSelection();
    if (!data.docs.length) get('status').textContent = '请先在工作台导入文献。';
  } catch (error) {get('status').textContent = error.message;}
})();
</script>
</html>
